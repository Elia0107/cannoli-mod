name: Build Cannoli Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDBOT: https://buildbot.libretro.com/nightly/android/latest
  CORES: >-
    fbneo gambatte genesis_plus_gx handy mame2003_plus mednafen_ngp
    mednafen_pce_fast mednafen_vb mednafen_wswan mgba nestopia pcsx_rearmed
    pokemini prosystem snes9x stella swanstation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cannoli
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Kitchen frontend
        uses: actions/checkout@v4
        with:
          repository: Elia0107/kitchen
          path: kitchen

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Kitchen frontend
        working-directory: kitchen
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Copy Kitchen assets
        run: |
          set -euo pipefail

          test -f kitchen/dist/index.html
          mkdir -p app/src/main/assets/kitchen
          rm -rf app/src/main/assets/kitchen/*
          cp -R kitchen/dist/. app/src/main/assets/kitchen/

          test -f app/src/main/assets/kitchen/index.html
          echo "Kitchen frontend copied successfully"

      - name: Download libretro cores
        run: |
          set -euo pipefail

          for arch in arm64-v8a armeabi-v7a; do
            dir="app/src/main/jniLibs/${arch}"
            mkdir -p "$dir"

            for core in $CORES; do
              name="${core}_libretro_android.so"
              echo "Downloading ${arch}/${name}"

              curl -fsSL \
                "${BUILDBOT}/${arch}/${name}.zip" \
                -o /tmp/core.zip

              unzip -o -q /tmp/core.zip -d "$dir"
              rm /tmp/core.zip

              if [ ! -f "${dir}/${name}" ]; then
                echo "::error::Missing core: ${dir}/${name}"
                exit 1
              fi
            done
          done

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Verify Kitchen and cores in APK
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK not found"
            exit 1
          fi

          unzip -l "$APK" | grep -E 'assets/kitchen/index\.html'
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/.*_libretro_android\.so$'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cannoli-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
